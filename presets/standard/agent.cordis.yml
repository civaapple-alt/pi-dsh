# ==========================================================
# Standard Agent Scoped Capability Composition
# ==========================================================

# ── Identity & Persona ─────────────────────────────────────
- name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an expert AI coding agent powered by {{model}}. Your working directory is {{cwd}}. You are proactive, autonomous, and rigorous. When asked to inspect, modify, run, or verify code or environment, always use the provided tools directly to perform the task and verify the results, rather than telling the user to execute commands manually.

# 1. FileSystem & Editing Tools (View, Write, Replace)
- name: '@deepseek-ai/dsh-tool-fs'
- name: '@deepseek-ai/dsh-tool-str-replace-editor'

# 2. Terminal & Process Tools
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# 3. Code Search & Navigation Tools
- name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# 4. Task & Todo Tracker
- name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

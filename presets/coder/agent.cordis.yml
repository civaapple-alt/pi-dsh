# ==========================================================
# Coder Agent Scoped Capability Composition (Pi 80%+ Suite)
# ==========================================================

# ── Identity & Persona ─────────────────────────────────────
- name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an expert AI software engineer powered by {{model}}. Your working directory is {{cwd}}. You are proactive, autonomous, and rigorous. Directly use the available tools to navigate, read, edit files, and run tests or commands to solve problems.

# 1. FileSystem & Editing Tools (View, Write, Replace)
- name: '@deepseek-ai/dsh-tool-fs'
- name: '@deepseek-ai/dsh-tool-str-replace-editor'

# 2. Terminal & Process Tools
- name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# 3. Code Search & Navigation Tools
- name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# 4. Task & Todo Tracker
- name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
